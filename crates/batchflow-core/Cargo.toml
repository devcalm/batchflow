[package]
name = "batchflow-core"
description = "Core traits and execution engine for BatchFlow, a Spring Batch-inspired batch processing framework for Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/batchflow-core"
keywords = ["batch", "etl", "pipeline", "orchestration", "job"]
categories = ["asynchronous", "concurrency"]

# Committed to source control (proptest replays these seeds before generating
# novel cases) but of no use to anyone downloading the crate: `src/properties.rs`
# is `#[cfg(test)]` and is not in the package, so the seeds would reference a
# module the published crate does not contain.
exclude = ["proptest-regressions/"]

# `conformance` is off by default, so without this docs.rs would not document
# the suite - and a backend author is exactly who needs to read it.
[package.metadata.docs.rs]
all-features = true

[features]
# The shared `JobRepository` test suite. A dev-dependency for backend authors;
# off by default so it never reaches a release build.
conformance = []

[dependencies]
async-trait.workspace = true
backon.workspace = true
thiserror.workspace = true
serde.workspace = true
metrics.workspace = true
# Backoff has to sleep, and there is no runtime-agnostic async sleep in std.
# `std::thread::sleep` here would block the whole worker thread.
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
serde_json.workspace = true
metrics-util.workspace = true

[[bench]]
name = "chunk_loop"
harness = false
