[package]
name = "batchflow-redis"
description = "Redis metadata store for BatchFlow, a Spring Batch-inspired batch processing framework for Rust."
version.workspace = true
edition.workspace = true
# Deliberately *not* `workspace = true`, for the same reason as
# `batchflow-postgres`: MSRV belongs to a crate's own dependency graph. redis
# 1.5 requires 1.88, and inheriting the workspace's 1.85 would publish a promise
# this crate cannot keep.
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/batchflow-redis"
keywords = ["batch", "etl", "redis", "orchestration", "job"]
categories = ["asynchronous", "database"]

[dependencies]
batchflow-core.workspace = true
redis.workspace = true
serde_json.workspace = true

[dev-dependencies]
batchflow-core = { workspace = true, features = ["conformance"] }
tokio.workspace = true
testcontainers-modules = { workspace = true, features = ["redis"] }
