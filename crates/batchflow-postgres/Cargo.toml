[package]
name = "batchflow-postgres"
description = "Postgres metadata store for BatchFlow, a Spring Batch-inspired batch processing framework for Rust."
version.workspace = true
edition.workspace = true
# Deliberately *not* `workspace = true`. MSRV is a property of a crate's own
# dependency graph, not of the repository: sqlx 0.9 requires 1.94, and
# inheriting the workspace's 1.85 would publish a promise this crate cannot
# keep. A user on 1.85 can still take `batchflow` with the in-memory store.
rust-version = "1.94"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/batchflow-postgres"
keywords = ["batch", "etl", "postgres", "sqlx", "orchestration"]
categories = ["asynchronous", "database"]

[dependencies]
batchflow-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = [
    "runtime-tokio",
    "postgres",
    "json",
    "macros",
    "migrate",
    "time",
] }

[dev-dependencies]
# The same crate as the normal dependency above, with the shared JobRepository
# test suite switched on. Cargo unifies the two, so the feature is present only
# while building tests.
batchflow-core = { workspace = true, features = ["conformance"] }
tokio.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres"] }
# Examples only, and only so they import through the facade the way a user
# does: `batchflow` + `batchflow-postgres` is exactly the pair an application
# declares. No cycle - `batchflow` depends on `batchflow-core`, not on this.
batchflow = { path = "../batchflow", version = "0.1.0" }
