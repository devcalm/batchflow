[package]
name = "batchflow"
description = "A production-grade batch processing framework for Rust, inspired by Spring Batch. Under active development — name reservation release."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/batchflow"
keywords = ["batch", "etl", "pipeline", "orchestration", "job"]
categories = ["asynchronous", "concurrency"]

[dependencies]
batchflow-core.workspace = true

# Examples only. A dev-dependency here is legitimate exactly when a real user
# would also declare it: nobody runs an async framework without a runtime, so
# `tokio` qualifies. `async-trait` would not — the whole point of re-exporting
# it from `batchflow-core` is that users never name it in their own manifest.
[dev-dependencies]
tokio.workspace = true
