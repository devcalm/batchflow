[workspace]
resolver = "3"
members = ["crates/*"]

# Metadata shared by every member crate. Individual crates opt in with
# `field.workspace = true`, so we bump versions / edition / license in one place.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Oleksii Tsvietaiev <o.tsvietaiev92@gmail.com>"]

# Dependencies shared across the workspace. Members reference them with
# `dep.workspace = true`, keeping versions aligned in one place.
[workspace.dependencies]
batchflow-core = { path = "crates/batchflow-core", version = "0.0.0" }
async-trait = "0.1"
# Backoff *schedules* only. The retry loop is hand-written: its body needs
# `&mut` access to the writer and committer and must own a fresh `Tx` per
# attempt, which backon's retry combinator cannot express.
backon = { version = "1", default-features = false, features = ["std"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false }
testcontainers-modules = "0.13"
# Facade only. Emitting is a null check until an application installs a
# recorder; the exporter and its dependencies live in `batchflow-metrics`.
metrics = "0.24"
metrics-util = "0.20"
tracing = "0.1"
# Test-only capture layer. `default-features = false` must be declared here and
# not in the member: a workspace dependency's default features cannot be turned
# off downstream. Drops the `fmt` stack, which a capture layer never formats.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "registry",
    "std",
] }
# `default-features = false` here rather than in the member: a workspace
# dependency's default-features cannot be turned off downstream. Drops
# `http-listener`/`push-gateway` and with them hyper, rustls and tokio-net.
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# Benchmarks only. `default-features = false` drops plotters, rayon and
# html_reports; `cargo_bench_support` is not optional — without it `cargo bench`
# refuses to run the harness at all.
criterion = { version = "0.7", default-features = false, features = [
    "async_tokio",
    "cargo_bench_support",
] }
